name: Deploy to Cloudflare Pages

# Publishes the site to Cloudflare Pages on every push to main (and on demand
# via the Actions tab). This is independent of Cloudflare's own Git integration —
# it works even if the Pages project was never connected to the repo.
#
# The `verify` job below IS ci.yml, called as a reusable workflow. That is
# deliberate: previously CI and deploy were two independent workflows running in
# parallel, so a red CI did not stop a deploy, and deploy's own gate had quietly
# drifted (it never checked that the COLA calculator or plan-diff pages existed,
# nor for unresolved {{TOKEN}}s). Now there is one gate, `deploy` needs it, and
# the artifact deploy ships is byte-for-byte the one that was verified.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard (right sidebar of any zone)
# Optional repository variables:
#   CLOUDFLARE_PAGES_PROJECT — Pages project name (defaults to "benefitdial")
#   SITE_URL                 — production origin used for canonicals/sitemap
#
# If the secrets are missing this workflow FAILS. It used to pass with only a
# ::notice, which meant main showed a green check while production still served
# the previous build. If deploys are not wanted yet, disable this workflow in
# Settings -> Actions rather than letting it report a success it did not perform.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Time-based copy goes stale without anyone touching the repo. The site tells
  # readers the COLA announcement is "expected on" a date, and the enrolment
  # window is open or closed depending on today — none of which a push-triggered
  # build ever re-evaluates. build-cola-data.mjs now FAILS once that date is
  # behind us while the row is still projected, so this daily run is what turns
  # that guard into an actual alarm: without it the check could sit unevaluated
  # for weeks while production served copy that had quietly become false.
  # A red run here means the data needs its annual update; production keeps
  # serving the last good deploy until it gets one.
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC — after the 8:30 a.m. ET BLS/SSA release window

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Full CI gate. Nothing deploys unless this is green.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      upload-dist: true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://benefitdial.com
    steps:
      - name: Download the verified dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error title=Deploy not performed::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are missing, so nothing was published — production is still serving the previous build. Add both under Settings -> Secrets and variables -> Actions, or disable this workflow if deploys are not wanted yet."
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Deploy dist/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'benefitdial' }}
